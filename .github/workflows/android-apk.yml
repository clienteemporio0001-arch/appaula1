name: Gerar APK Android
on:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'scripts/generate-assets.cjs'
      - 'app.json'
      - 'package.json'
      - 'eas.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astro-calc-android
  cancel-in-progress: false

jobs:
  apk:
    name: Android APK offline
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar dependências e produzir imagens locais
        run: npm install --no-audit --no-fund
      - name: Confirmar ferramentas e configurações
        run: |
          node -e "const x=require('./app.json').expo; if(x.android.package!=='com.mmsolucoes.astrocalc'||x.android.versionCode!==1||x.version!=='1.0.0')process.exit(1)"
          npm run check
          npm test
          node -e "const f=require('fs');['icon.png','adaptive-icon.png','splash-icon.png'].forEach(n=>{if(!f.existsSync('assets/'+n))throw Error('Missing asset '+n)})"
      - name: Criar projeto Android nativo
        run: npx expo prebuild --platform android --no-install
      - name: Compilar APK release com JavaScript offline
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verificar APK e preservar artefato
        run: |
          set -euo pipefail
          APK_PATH=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$APK_PATH"
          mkdir -p out-apk
          cp "$APK_PATH" out-apk/ASTRO-CALC-v1.0.0-preview.apk
          sha256sum out-apk/*.apk > out-apk/SHA256SUMS.txt
          ls -lh out-apk/
          test $(stat -c%s out-apk/ASTRO-CALC-v1.0.0-preview.apk) -gt 1000000
      - name: Download pelo GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: astro-calc-android-apk
          path: out-apk/
          if-no-files-found: error
          retention-days: 30
      - name: Publicar link direto em GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="astrocalc-v1.0.0-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out-apk/ASTRO-CALC-v1.0.0-preview.apk out-apk/SHA256SUMS.txt --target "$GITHUB_SHA" --title "ASTRO CALC 1.0.0 · APK de testes #${GITHUB_RUN_NUMBER}" --notes "APK release de testes, assinado com chave de desenvolvimento Android. O JavaScript está embutido para uso offline. Não usar este artefato na Google Play." --prerelease
